apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-url-shortener
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smart-url-shortener
  template:
    metadata:
      labels:
        app: smart-url-shortener
    spec:
      containers:
        - name: smart-url-shortener
          image: smart-url-shortener:v1
          imagePullPolicy: Never   # image is built locally (minikube/kind/docker-desktop)
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: smart-url-shortener-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
