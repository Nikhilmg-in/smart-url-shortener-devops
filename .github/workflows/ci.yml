name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test

      - name: Build wheel
        run: make build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-url-shortener-wheel
          path: dist/*.whl
